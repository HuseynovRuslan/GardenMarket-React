<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <!-- Generated from the store's own logo (public/icons + favicon-*.png) via
         scripts run at setup time — regenerate them if the logo changes. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#4C9A2A" />
    <title>GardenMarket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Products and their photos come from another origin, so the browser
         would otherwise pay DNS + TCP + TLS (~250ms) only after React has
         mounted and issued the first request. Warm it up during page parse. -->
    <link rel="preconnect" href="https://gardenmarket-api.bahram.site" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
